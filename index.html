<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkClock</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font:  'Google Sans', 'Product Sans', -apple-system, sans-serif;
    --bg:    #f2f2f7;
    --bg2:   #ffffff;
    --label: #000000;
    --l3:    rgba(60,60,67,0.6);
    --l4:    rgba(60,60,67,0.22);
    --sep:   rgba(60,60,67,0.12);
    --fill:  rgba(120,120,128,0.12);
    --fill2: rgba(120,120,128,0.07);
    --blue:  #007aff;
    --green: #34c759;
    --orange:#ff9500;
    --red:   #ff3b30;
    --gray:  #8e8e93;
    --sh:    0 1px 3px rgba(0,0,0,0.07),0 2px 10px rgba(0,0,0,0.05);
    --r:     14px;
    --rsm:   10px;
    --pill:  100px;
  }
  [data-theme="dark"] {
    --bg:    #000000;
    --bg2:   #1c1c1e;
    --label: #ffffff;
    --l3:    rgba(235,235,245,0.6);
    --l4:    rgba(235,235,245,0.18);
    --sep:   rgba(84,84,88,0.55);
    --fill:  rgba(118,118,128,0.24);
    --fill2: rgba(118,118,128,0.14);
    --blue:  #0a84ff;
    --green: #30d158;
    --orange:#ff9f0a;
    --red:   #ff453a;
    --sh:    0 1px 4px rgba(0,0,0,0.4),0 2px 12px rgba(0,0,0,0.3);
  }

  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--label);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s;}

  /* SHELL */
  .app{display:grid;grid-template-rows:52px 1fr;height:100vh;overflow:hidden;}

  /* TOPBAR */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:var(--bg2);border-bottom:1px solid var(--sep);transition:background .3s;}
  .tb-left{font-size:16px;font-weight:700;letter-spacing:-.4px;}
  .tb-right{display:flex;align-items:center;gap:12px;}
  .tb-date{font-size:14px;font-weight:500;color:var(--l3);}
  .tb-div{width:1px;height:16px;background:var(--sep);}
  .tb-clock{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.3px;}
  .theme-btn{width:30px;height:30px;border-radius:50%;border:none;background:var(--fill);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .theme-btn:hover{background:var(--fill2);}

  /* COLUMNS */
  .cols{display:grid;grid-template-columns:1fr 1fr;height:100%;overflow:hidden;}
  .col{padding:24px;overflow-y:auto;border-right:1px solid var(--sep);}
  .col:last-child{border-right:none;}
  .col::-webkit-scrollbar{width:4px;}
  .col::-webkit-scrollbar-thumb{background:var(--fill);border-radius:4px;}

  /* SECTION HEADER */
  .sh{font-size:11px;font-weight:700;color:var(--l3);text-transform:uppercase;letter-spacing:.7px;margin:0 4px 8px;}

  /* CARD */
  .card{background:var(--bg2);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:20px;transition:background .3s;}

  /* PROGRESS CARD */
  .prog-card{padding:18px 18px 16px;}
  .prog-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;}
  .prog-note{font-size:13px;color:var(--l3);font-weight:500;}
  .prog-pct{font-size:36px;font-weight:700;letter-spacing:-1.5px;font-variant-numeric:tabular-nums;line-height:1;}
  .prog-pct sup{font-size:20px;font-weight:600;color:var(--l3);letter-spacing:0;vertical-align:super;}

  .track{height:6px;background:var(--fill);border-radius:var(--pill);overflow:hidden;margin-bottom:16px;}
  .track-fill{height:100%;background:var(--blue);border-radius:var(--pill);transition:width 1s linear;position:relative;overflow:hidden;}
  .track-fill.g{background:var(--green);}
  .track-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:sheen 2.5s ease-in-out infinite;}
  @keyframes sheen{0%{transform:translateX(-150%)}100%{transform:translateX(220%)}}

  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--sep);border-radius:var(--rsm);overflow:hidden;}
  .stat-cell{background:var(--bg2);padding:16px 8px;text-align:center;transition:background .3s;}
  .stat-val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px;}
  .stat-val.g{color:var(--green);}
  .stat-val.o{color:var(--orange);}
  .stat-val.b{color:var(--blue);}
  .stat-lbl{font-size:11px;color:var(--l3);margin-top:4px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}

  /* INTERVAL LIST */
  .iv-item{padding:14px 18px;}
  .iv-item+.iv-item{border-top:1px solid var(--sep);}
  .iv-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .iv-dot{width:8px;height:8px;border-radius:50%;background:var(--gray);flex-shrink:0;}
  .iv-dot.active{background:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.18);}
  .iv-dot.done{background:var(--green);}
  [data-theme="dark"] .iv-dot.active{box-shadow:0 0 0 3px rgba(10,132,255,.25);}
  .iv-times{flex:1;font-size:15px;font-weight:500;letter-spacing:-.3px;font-variant-numeric:tabular-nums;}
  .iv-times .arr{color:var(--l3);font-weight:400;}
  .iv-dur{font-size:13px;color:var(--l3);font-weight:400;}
  .iv-badge{font-size:11px;font-weight:600;padding:3px 10px;border-radius:var(--pill);}
  .iv-badge.active{background:rgba(0,122,255,.1);color:var(--blue);}
  .iv-badge.done{background:rgba(52,199,89,.1);color:var(--green);}
  .iv-badge.future{background:var(--fill);color:var(--l3);}
  [data-theme="dark"] .iv-badge.active{background:rgba(10,132,255,.18);}
  [data-theme="dark"] .iv-badge.done{background:rgba(48,209,88,.18);}
  .del-btn{background:none;border:none;color:var(--l4);font-size:18px;cursor:pointer;padding:0 4px;border-radius:5px;transition:color .15s;line-height:1;}
  .del-btn:hover{color:var(--red);}
  .iv-prog{display:flex;flex-direction:column;gap:5px;}
  .iv-track{height:4px;background:var(--fill);border-radius:var(--pill);overflow:hidden;}
  .iv-fill{height:100%;border-radius:var(--pill);transition:width 1s linear;}
  .iv-fill.active{background:var(--blue);}
  .iv-fill.done{background:var(--green);}
  .iv-fill.future{width:0!important;}
  .iv-prog-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--l3);font-variant-numeric:tabular-nums;}
  .iv-pct{font-weight:600;}
  .iv-pct.active{color:var(--blue);}
  .iv-pct.done{color:var(--green);}
  .break-sep{display:flex;align-items:center;gap:10px;padding:5px 18px;border-top:1px solid var(--sep);}
  .break-line{flex:1;height:1px;background:var(--sep);}
  .break-lbl{font-size:11px;color:var(--l3);font-weight:500;white-space:nowrap;}
  .empty{padding:36px 16px;text-align:center;}
  .empty-icon{font-size:32px;display:block;margin-bottom:8px;opacity:.4;}
  .empty-title{font-size:15px;font-weight:600;margin-bottom:3px;}
  .empty-sub{font-size:13px;color:var(--l3);}

  /* FORM */
  .form-inner{padding:16px 18px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .f-group{display:flex;flex-direction:column;gap:5px;}
  .f-label{font-size:11px;font-weight:700;color:var(--l3);text-transform:uppercase;letter-spacing:.5px;}
  input[type="time"]{width:100%;background:var(--fill2);border:1.5px solid transparent;border-radius:var(--rsm);color:var(--label);font-family:var(--font);font-size:16px;font-weight:500;padding:10px 12px;outline:none;transition:border-color .2s,background .2s;color-scheme:light dark;font-variant-numeric:tabular-nums;}
  input[type="time"]:focus{border-color:var(--blue);background:var(--bg2);}
  .btn-add{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;letter-spacing:-.2px;transition:opacity .15s,transform .1s;}
  .btn-add:hover{opacity:.88;}
  .btn-add:active{transform:scale(.98);}
  .btn-clear{width:100%;margin-top:10px;padding:12px;background:var(--bg2);color:var(--red);border:none;border-radius:var(--r);font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--sh);transition:opacity .15s,background .2s,color .2s;}
  .btn-clear:hover{opacity:.75;}

  /* CALENDAR */
  .cal-card{padding:20px;}
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .cal-title{font-size:22px;font-weight:700;letter-spacing:-.5px;}
  .cal-nav{display:flex;gap:8px;}
  .cal-nav-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--sep);background:var(--bg2);color:var(--label);font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;transition:background .15s;}
  .cal-nav-btn:hover{background:var(--fill);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--sep);border-top:1px solid var(--sep);}
  .cal-head{padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:var(--l3);text-transform:uppercase;letter-spacing:.5px;border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);background:var(--fill2);}
  .cal-cell{min-height:60px;padding:8px;border-right:1px solid var(--sep);border-bottom:1px solid var(--sep);transition:background .15s;}
  .cal-cell.empty{background:var(--fill2);opacity:.4;}
  .cal-cell.weekend{background:var(--fill2);}
  .cal-cell.workday{cursor:pointer;}
  .cal-cell.workday:hover{background:var(--fill2);}
  .cal-num{font-size:13px;font-weight:600;color:var(--l3);width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cal-cell.today   .cal-num{background:var(--blue);color:#fff;}
  .cal-cell.done    .cal-num{background:var(--green);color:#fff;}
  .cal-cell.today.done .cal-num{background:var(--green);color:#fff;box-shadow:0 0 0 3px rgba(52,199,89,.2);}
  .cal-cell.weekend .cal-num{color:var(--l4);}

  /* COUNTDOWN */
  .cd-row{display:flex;align-items:center;justify-content:space-between;padding-top:16px;margin-top:4px;border-top:1px solid var(--sep);}
  .cd-label{font-size:11px;font-weight:700;color:var(--l3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .cd-sub{font-size:12px;color:var(--l3);font-weight:500;}
  .cd-val{font-size:36px;font-weight:700;letter-spacing:-.5px;color:var(--orange);}

  /* TOAST */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(40,40,42,.93);color:#fff;font-family:var(--font);font-size:13px;font-weight:500;padding:10px 18px;border-radius:var(--pill);white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;z-index:99;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="tb-left">WorkClock</div>
    <div class="tb-right">
      <div class="tb-date"  id="tbDate">---</div>
      <div class="tb-div"></div>
      <div class="tb-clock" id="tbClock">--:--:--</div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div class="cols">

    <!-- LEFT -->
    <div class="col">
      <div class="sh">Avanzamento</div>
      <div class="card">
        <div class="prog-card">
          <div class="prog-top">
            <div class="prog-note" id="progNote">—</div>
            <div class="prog-pct" id="pct">0<sup>%</sup></div>
          </div>
          <div class="track"><div class="track-fill" id="trackFill" style="width:0%"></div></div>
          <div class="stats-grid">
            <div class="stat-cell">
              <div class="stat-val g" id="doneTime">--:--:--</div>
              <div class="stat-lbl">Lavorate</div>
            </div>
            <div class="stat-cell">
              <div class="stat-val o" id="remainTime">--:--:--</div>
              <div class="stat-lbl">Rimanenti</div>
            </div>
            <div class="stat-cell">
              <div class="stat-val b" id="totalTime">--</div>
              <div class="stat-lbl">Totale</div>
            </div>
          </div>
        </div>
      </div>

      <div class="sh">Intervalli</div>
      <div class="card" id="ivList">
        <div class="empty">
          <span class="empty-icon">🕐</span>
          <div class="empty-title">Nessun intervallo</div>
          <div class="empty-sub">Aggiungi il tuo primo orario di lavoro</div>
        </div>
      </div>

      <button class="btn-clear" id="clearBtn" onclick="confirmClear()">Cancella tutto</button>

      <div class="sh" style="margin-top:20px">Aggiungi intervallo</div>
      <div class="card">
        <div class="form-inner">
          <div class="form-row">
            <div class="f-group">
              <div class="f-label">Inizio</div>
              <input type="time" id="inputStart" />
            </div>
            <div class="f-group">
              <div class="f-label">Fine</div>
              <input type="time" id="inputEnd" />
            </div>
          </div>
          <button class="btn-add" onclick="addInterval()">Aggiungi</button>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col">
      <div class="card">
        <div class="cal-card">
          <div class="cal-header">
            <div class="cal-title" id="calTitle">—</div>
            <div class="cal-nav">
              <button class="cal-nav-btn" onclick="calPrev()">← Prec</button>
              <button class="cal-nav-btn" onclick="calNext()">Succ →</button>
            </div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cd-row">
            <div>
              <div class="cd-label">Fine settimana tra</div>
              <div class="cd-sub" id="cdSub">—</div>
            </div>
            <div class="cd-val" id="cdVal">--</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const KEY_IV   = 'workclock_intervals';
  const KEY_DONE = 'workclock_completed';
  const KEY_TH   = 'workclock_theme';
  let intervals  = [];
  const pad = n => String(n).padStart(2,'0');

  // ── Storage ───────────────────────────────────
  function saveIV()  { localStorage.setItem(KEY_IV,   JSON.stringify(intervals)); }
  function loadIV()  { try { const r=localStorage.getItem(KEY_IV);   if(r) intervals=JSON.parse(r); } catch(e){} }
  function loadDone(){ try { return JSON.parse(localStorage.getItem(KEY_DONE)||'[]'); } catch(e){ return []; } }
  function saveDone(a){ localStorage.setItem(KEY_DONE, JSON.stringify(a)); }

  // ── Theme ─────────────────────────────────────
  function toggleTheme(){
    const n = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',n);
    document.getElementById('themeBtn').textContent = n==='dark'?'☀️':'🌙';
    localStorage.setItem(KEY_TH,n);
  }
  function loadTheme(){
    const t = localStorage.getItem(KEY_TH)||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    document.documentElement.setAttribute('data-theme',t);
    document.getElementById('themeBtn').textContent = t==='dark'?'☀️':'🌙';
  }

  // ── Helpers ───────────────────────────────────
  const toMins = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const toSecs = s => { const [h,m]=s.split(':').map(Number); return h*3600+m*60; };
  const nowMins= ()=>{ const d=new Date(); return d.getHours()*60+d.getMinutes()+d.getSeconds()/60; };
  const nowSecs= ()=>{ const d=new Date(); return d.getHours()*3600+d.getMinutes()*60+d.getSeconds(); };
  function fmtDur(m){ if(m<=0)return'0m'; const h=Math.floor(m/60),mm=Math.floor(m%60); return h&&mm?`${h}h ${mm}m`:h?`${h}h`:`${mm}m`; }
  function fmtHMS(s){ if(s<=0)return'00:00:00'; return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(Math.floor(s%60))}`; }
  function dateKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

  // ── Intervals ─────────────────────────────────
  function addInterval(){
    const s=document.getElementById('inputStart').value;
    const e=document.getElementById('inputEnd').value;
    if(!s||!e) return toast('Inserisci inizio e fine');
    if(toMins(e)<=toMins(s)) return toast("La fine deve essere dopo l'inizio");
    for(const iv of intervals) if(toMins(s)<toMins(iv.end)&&toMins(e)>toMins(iv.start)) return toast('Intervallo sovrapposto');
    intervals.push({start:s,end:e});
    intervals.sort((a,b)=>toMins(a.start)-toMins(b.start));
    saveIV(); render();
    document.getElementById('inputStart').value=e;
    document.getElementById('inputEnd').value='';
    toast('Intervallo aggiunto');
  }
  function deleteInterval(i){ intervals.splice(i,1); saveIV(); render(); toast('Rimosso'); }

  let clearPending=false, clearTimer;
  function confirmClear(){
    const btn=document.getElementById('clearBtn');
    if(!clearPending){
      clearPending=true;
      btn.textContent='Conferma cancellazione';
      btn.style.background='var(--red)'; btn.style.color='#fff';
      clearTimer=setTimeout(()=>{ clearPending=false; btn.textContent='Cancella tutto'; btn.style.background=''; btn.style.color=''; },3000);
    } else {
      clearTimeout(clearTimer); clearPending=false;
      btn.textContent='Cancella tutto'; btn.style.background=''; btn.style.color='';
      intervals=[]; saveIV(); render(); toast('Tutto cancellato');
    }
  }

  // ── Calendar ──────────────────────────────────
  const MONTHS_CAP = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
  const MONTHS_LOW = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const DAY_HEADS  = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];

  let calYear  = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let lastPhase = 'idle';

  function calPrev(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCal(lastPhase); }
  function calNext(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCal(lastPhase); }

  function renderCal(phase){
    lastPhase = phase;
    const today    = new Date();
    const todayKey = dateKey(today);
    const done     = loadDone();

    // Auto-mark today if done
    if(phase==='done' && !done.includes(todayKey)){ done.push(todayKey); saveDone(done); }

    document.getElementById('calTitle').textContent = `${MONTHS_CAP[calMonth]} ${calYear}`;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    // Headers
    DAY_HEADS.forEach(d=>{ const el=document.createElement('div'); el.className='cal-head'; el.textContent=d; grid.appendChild(el); });

    // Offset: first day of month, Mon-based
    const firstDow = new Date(calYear,calMonth,1).getDay(); // 0=Sun
    const offset   = firstDow===0 ? 6 : firstDow-1;
    const daysInM  = new Date(calYear,calMonth+1,0).getDate();

    for(let i=0;i<offset;i++){ const el=document.createElement('div'); el.className='cal-cell empty'; grid.appendChild(el); }

    for(let day=1;day<=daysInM;day++){
      const d   = new Date(calYear,calMonth,day);
      const dow = d.getDay(); // 0=Sun,6=Sat
      const isW = dow===0||dow===6;
      const key = dateKey(d);
      const isToday = key===todayKey;
      const isDone  = done.includes(key)&&!isW;

      let cls='cal-cell';
      if(isW)    cls+=' weekend';
      else       cls+=' workday';
      if(isToday)cls+=' today';
      if(isDone) cls+=' done';

      const el=document.createElement('div');
      el.className=cls;
      el.innerHTML=`<div class="cal-num">${day}</div>`;
      if(!isW){
        el.addEventListener('click',()=>{
          const arr=loadDone();
          const idx=arr.indexOf(key);
          if(idx>=0)arr.splice(idx,1); else arr.push(key);
          saveDone(arr); renderCal(lastPhase);
        });
      }
      grid.appendChild(el);
    }

    // Countdown
    const now=new Date();
    const dow=now.getDay();
    const isWEnd=dow===0||dow===6;
    const cdVal=document.getElementById('cdVal');
    const cdSub=document.getElementById('cdSub');

    const daysToSat = dow===6?0:(6-dow);
    const nextSat=new Date(now);
    nextSat.setDate(now.getDate()+daysToSat);
    nextSat.setHours(0,0,0,0);

    if(isWEnd){
      cdVal.textContent='🎉'; cdVal.style.fontSize='28px'; cdVal.style.color='var(--green)';
      cdSub.textContent='Buon weekend!';
    } else {
      let label='';
      const h=now.getHours();
      if(dow===1)label='-5';
      else if(dow===2)label='-4';
      else if(dow===3)label='-3';
      else if(dow===4)label='-2';
      else if(dow===5&&h<12)label='-1';
      else if(dow===5&&h>=12)label='-½';
      cdVal.textContent=label; cdVal.style.fontSize='36px'; cdVal.style.color='var(--orange)';
      cdSub.textContent=`Sabato ${nextSat.getDate()} ${MONTHS_LOW[nextSat.getMonth()]}`;
    }
  }

  // ── Main render ────────────────────────────────
  function render(){
    const now=nowMins(), ns=nowSecs(), d=new Date();

    // Topbar
    document.getElementById('tbClock').textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    const DAYS=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
    document.getElementById('tbDate').textContent=`${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS_LOW[d.getMonth()]} ${d.getFullYear()}`;

    if(!intervals.length){
      document.getElementById('pct').innerHTML='0<sup>%</sup>';
      document.getElementById('trackFill').style.width='0%';
      document.getElementById('trackFill').className='track-fill';
      document.getElementById('doneTime').textContent='--:--:--';
      document.getElementById('remainTime').textContent='--:--:--';
      document.getElementById('totalTime').textContent='--';
      document.getElementById('progNote').textContent='—';
      document.getElementById('ivList').innerHTML=`<div class="empty"><span class="empty-icon">🕐</span><div class="empty-title">Nessun intervallo</div><div class="empty-sub">Aggiungi il tuo primo orario di lavoro</div></div>`;
      renderCal('idle');
      return;
    }

    const totalMins  = intervals.reduce((a,iv)=>a+toMins(iv.end)-toMins(iv.start),0);
    const firstStart = toMins(intervals[0].start);
    const lastEnd    = toMins(intervals[intervals.length-1].end);

    let workedMins=0, curIv=null, phase='before';
    for(let i=0;i<intervals.length;i++){
      const sm=toMins(intervals[i].start), em=toMins(intervals[i].end);
      if(now>=em){ workedMins+=em-sm; }
      else if(now>=sm){ workedMins+=now-sm; curIv={iv:intervals[i],idx:i}; phase='working'; }
      else if(phase!=='working'&&i>0&&now>=toMins(intervals[i-1].end)) phase='break';
    }
    if(now<firstStart) phase='before';
    if(now>=lastEnd)   phase='done';

    let wSecs=0;
    for(const iv of intervals){ const sm=toSecs(iv.start),em=toSecs(iv.end); if(ns>=em)wSecs+=em-sm; else if(ns>=sm)wSecs+=ns-sm; }
    const rSecs=Math.max(0,totalMins*60-wSecs);
    const pct=totalMins>0?Math.min(100,workedMins/totalMins*100):0;

    document.getElementById('pct').innerHTML=`${pct.toFixed(2)}<sup>%</sup>`;
    const tf=document.getElementById('trackFill');
    tf.style.width=pct.toFixed(2)+'%';
    tf.className='track-fill'+(phase==='done'?' g':'');
    document.getElementById('doneTime').textContent=fmtHMS(wSecs);
    document.getElementById('remainTime').textContent=fmtHMS(rSecs);
    document.getElementById('totalTime').textContent=fmtDur(totalMins);

    const notes={before:'In attesa',working:fmtDur(workedMins)+' fatte',break:fmtDur(workedMins)+' fatte',done:'Completato'};
    document.getElementById('progNote').textContent=notes[phase]||'—';

    // Interval list
    const list=document.getElementById('ivList');
    list.innerHTML='';
    intervals.forEach((iv,i)=>{
      const sm=toMins(iv.start),em=toMins(iv.end),dur=em-sm;
      const smS=toSecs(iv.start),emS=toSecs(iv.end);
      let state='future',fp=0,ivW=0;
      if(ns>=emS){state='done';fp=100;ivW=emS-smS;}
      else if(ns>=smS){state='active';ivW=ns-smS;fp=(ns-smS)/(emS-smS)*100;}
      const el=document.createElement('div');
      el.className='iv-item';
      el.innerHTML=`
        <div class="iv-top">
          <div class="iv-dot ${state}"></div>
          <div class="iv-times">${iv.start} <span class="arr">→</span> ${iv.end} <span class="iv-dur"> · ${fmtDur(dur)}</span></div>
          <span class="iv-badge ${state}">${state==='done'?'Completato':state==='active'?'In corso':'In attesa'}</span>
          <button class="del-btn" onclick="deleteInterval(${i})">×</button>
        </div>
        <div class="iv-prog">
          <div class="iv-track"><div class="iv-fill ${state}" style="width:${fp.toFixed(2)}%"></div></div>
          <div class="iv-prog-lbl"><span>${fmtHMS(ivW)}</span><span class="iv-pct ${state}">${fp.toFixed(2)}%</span><span>${fmtDur(dur)}</span></div>
        </div>`;
      list.appendChild(el);
      if(i<intervals.length-1){
        const brk=toMins(intervals[i+1].start)-em;
        if(brk>0){ const sep=document.createElement('div'); sep.className='break-sep'; sep.innerHTML=`<div class="break-line"></div><span class="break-lbl">☕ Pausa ${fmtDur(brk)}</span><div class="break-line"></div>`; list.appendChild(sep); }
      }
    });

    renderCal(phase);
  }

  // ── Toast ──────────────────────────────────────
  let toastTimer;
  function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }

  document.getElementById('inputEnd').addEventListener('keydown',e=>{ if(e.key==='Enter')addInterval(); });

  // ── Init ───────────────────────────────────────
  loadTheme();
  loadIV();
  render();
  setInterval(render, 1000);
</script>
</body>
</html>
